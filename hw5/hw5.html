<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>UNM CS 412/512 HW3</title>
  <style>
    body {
      background: #111;
      color: #ccc;
      font-family: monospace;
    }

    textarea {
      background: #222;
      color: #0f0;
      font: 14px monospace;
      width: 400px;
      height: 250px;
    }

    canvas {
      border: 1px solid #444;
    }
  </style>
</head>

<body>
  <h2>Tentacle Monster</h2>
  <p>Use the arrow keys to control the monsters tentacle. 
    You can jump (up key), lean left and right (left/right keys) 
    and adjust the glow of the tentacles lure using the slider.<br>
  </p>

  <div style="display: flex; gap: 10px; align-items: flex-start;">
    <canvas id="glcanvas" width="400" height="400"></canvas>
  </div>
  <div>
  <label for="specularIntensity">
    Intensity of lure:
  </label>

  <input
    type="range"
    id="specularIntensity"
    min="0"
    max="3"
    step="0.05"
    value="1"
  />

  <span id="intensityValue">1.00</span>
</div>

  <script src="primitives.js"></script>
  <script src="shaders.js"></script>
  <script src="transformations.js"></script>
  <script src="hierarchical.js"></script>
  <script src="shading.js"></script>

  <script>
    // WebGL setup
    const canvas = document.getElementById("glcanvas");
    const gl = canvas.getContext("webgl2");
    if (!gl) alert("WebGL2 not supported");

    // Buffers, each sphere gets its own buffer
    function initBuffers() {
      for (let i = 0; i < tentacle.length; i++) {
        const sphere = tentacle[i].sphere;

        sphere.vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, sphere.vbo);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          sphere.positions,
          gl.STATIC_DRAW
        );

        sphere.cbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, sphere.cbo);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          sphere.colors,
          gl.STATIC_DRAW
        );

        sphere.ibo = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, sphere.ibo);
        gl.bufferData(
          gl.ELEMENT_ARRAY_BUFFER,
          sphere.indices,
          gl.STATIC_DRAW
        );
      }
    }
    initBuffers();

    let specularShader, flatShader;
    specularShader = initSpecularProgram(gl);
    flatShader = initFlatProgram(gl);

    let specularIntensity = 0.0;

    const intensitySlider =
      document.getElementById("specularIntensity");

    const intensityValue =
      document.getElementById("intensityValue");

    intensitySlider.addEventListener("input", () => {
      specularIntensity = Number(intensitySlider.value);
      intensityValue.textContent = specularIntensity.toFixed(2);
    });

    document.addEventListener("keydown", e => {
      switch (e.key) {
        case "ArrowUp":
          e.preventDefault();
          startJump();
          break;
        case "ArrowLeft":
          e.preventDefault();
          foldLeft();
          break;
        case "ArrowRight":
          e.preventDefault();
          foldRight();
          break;
      }
    });

    document.addEventListener("keyup", e => {
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        unfold();
      }
    });


    // projection setup
    let fov = Math.PI / 4, aspect = canvas.width / canvas.height, zNear = 0.1, zFar = 100;
    let orthoSize = 5.0; // changed this so i could see more of the scene
    // perspective and orthographic projection
    let projPerspective = perspective(fov, aspect, zNear, zFar);
    let projOrtho = matMul(box2Cube(-orthoSize * aspect, orthoSize * aspect, -orthoSize, orthoSize, zNear, zFar),flipZ());
    let proj = projOrtho;

    let currentModelViewMatrix = mat4Identity();
    let currentProjectionMatrix = mat4Identity();

    
    let activeProgram;
    let activePosLoc;
    let activeColorLoc;

    function drawSphere(sphere, transformation) {
      const isTopSphere = sphere === tentacle[4].sphere;
      const isNotTop = !isTopSphere;

      if (isTopSphere) {
        activeProgram = specularShader.program;
        activePosLoc = specularShader.posLoc;
        activeColorLoc = specularShader.colorLoc;

        gl.useProgram(activeProgram);
        gl.uniform1f(specularShader.uSecondLightIntensity, specularIntensity);

        gl.uniformMatrix4fv(specularShader.uMVM, false, currentModelViewMatrix);
        gl.uniformMatrix4fv(specularShader.uPM, false, currentProjectionMatrix);
        gl.uniformMatrix4fv(specularShader.uMTM, false, transformation);

      } else {
        activeProgram = flatShader.program;
        activePosLoc = flatShader.posLoc;
        activeColorLoc = flatShader.colorLoc;

        gl.useProgram(activeProgram);


        gl.uniformMatrix4fv(flatShader.uMVM, false, currentModelViewMatrix);
        gl.uniformMatrix4fv(flatShader.uPM, false, currentProjectionMatrix);
        gl.uniformMatrix4fv(flatShader.uMTM, false, transformation);
      }

      gl.bindBuffer(gl.ARRAY_BUFFER, sphere.vbo);
      gl.enableVertexAttribArray(activePosLoc);
      gl.vertexAttribPointer(activePosLoc, 3, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ARRAY_BUFFER, sphere.cbo);
      gl.enableVertexAttribArray(activeColorLoc);
      gl.vertexAttribPointer(activeColorLoc, 3, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, sphere.ibo);

      gl.drawElements(
        gl.TRIANGLES,
        sphere.indices.length,
        gl.UNSIGNED_SHORT,
        0
      );
    }


    function render() {
      // Smoothly approach the target folding angle
      foldAngle += (targetFoldAngle - foldAngle) * 0.12;
      let camX = 0, camY = -4, camZ = -10;
      gl.enable(gl.DEPTH_TEST);

      gl.clearColor(0.1, 0.1, 0.1, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

      let modelViewMatrix = mat4Identity();

      modelViewMatrix = mat4Translate(
        modelViewMatrix,
        [camX, camY, camZ]
      );

      // Projection setup...
      let projOrtho = matMul(
        box2Cube(
          -orthoSize * aspect,
          orthoSize * aspect,
          -orthoSize,
          orthoSize,
          zNear,
          zFar
        ),
        flipZ()
      );

      currentModelViewMatrix = modelViewMatrix;
      currentProjectionMatrix = projOrtho;
      drawTentacle();
    }
  // Initialize when page loads
  window.onload = function () {
    setInterval(render, 30);
  }

  </script>
</body>

</html>
